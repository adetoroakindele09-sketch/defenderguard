<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Forgot Password | Malware Detection System</title>


<link rel="stylesheet" href="forgot-password.css">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


</head>


<body>


<div class="container">



    <!-- LEFT SECTION -->

    <div class="left-section">


        <h1>
            Malware Detection System
        </h1>


        <p>

        Reset your password to regain access to the
        File Activity Malware Detection Dashboard.

        </p>


    </div>





    <!-- RIGHT SECTION -->


    <div class="right-section">



        <form id="forgotPasswordForm">



            <h2>
                Forgot Password
            </h2>




            <!-- ALERT MESSAGE -->


            <div id="alertBox"></div>







            <!-- EMAIL -->


            <div class="input-box">


                <i class="fa-solid fa-envelope"></i>


                <input

                type="email"

                id="email"

                placeholder="Registered Email Address"

                required>

            
            </div>








            <!-- NEW PASSWORD -->


            <div class="input-box">


                <i class="fa-solid fa-lock"></i>



                <input

                type="password"

                id="newPassword"

                placeholder="New Password"

                required>




                <i class="fa-solid fa-eye togglePassword"

                id="togglePassword"></i>



            </div>








            <!-- CONFIRM PASSWORD -->


            <div class="input-box">


                <i class="fa-solid fa-lock"></i>


                <input

                type="password"

                id="confirmPassword"

                placeholder="Confirm New Password"

                required>


            </div>







            <!-- PASSWORD REQUIREMENTS -->


            <div class="password-info">


                <p>
                    Password must contain:
                </p>


                <ul>


                    <li>
                        Minimum 8 characters
                    </li>


                    <li>
                        Uppercase letter
                    </li>


                    <li>
                        Lowercase letter
                    </li>


                    <li>
                        Number and special character
                    </li>


                </ul>


            </div>







            <button type="submit">


                Reset Password


            </button>








            <p class="login-link">


                Remember your password?


                <a href="login.html">

                    Login

                </a>


            </p>



        </form>



    </div>



</div>





<script src="forgot-password.js"></script>


</body>

</html>
