<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="login.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<div class="container">

    <!-- Left Section -->
    <div class="left-section">
        <h1>Malware Detection System</h1>
        <p>
            Login to access the File Activity Malware Detection Dashboard and monitor system activities securely.
        </p>
    </div>

    <!-- Right Section -->
    <div class="right-section">

        <form id="loginForm">

    <h2>Login</h2>

    <div id="alertBox"></div>

    <div class="input-box">
        <i class="fa-solid fa-envelope"></i>
        <input
            type="email"
            id="email"
            placeholder="Email Address"
            required>
    </div>

    <div class="input-box">
        <i class="fa-solid fa-lock"></i>
        <input
            type="password"
            id="password"
            placeholder="Password"
            required>

        <i class="fa-solid fa-eye togglePassword"
            id="togglePassword"></i>
    </div>

    <div class="options">
        <label>
            <input type="checkbox">
            Remember Me
        </label>

            <a href="forgot-password.html">
    Forgot Password?
</a>
    </div>

    <button type="submit">
        Login
    </button>

    <p class="login-link">
        Don't have an account?
        <a href="signup.html">Create Account</a>
    </p>

</form>
    </div>

</div>

<script src="login.js"></script>

</body>
</html>
